services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jisa_banking
      POSTGRES_USER: jisa
      POSTGRES_PASSWORD: jisa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U jisa -d jisa_banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DEBUG: "0"
      SECRET_KEY: local-demo-secret
      DATABASE_URL: postgresql://jisa:jisa_password@db:5432/jisa_banking
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
